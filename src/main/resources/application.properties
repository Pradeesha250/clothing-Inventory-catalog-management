# Server Port Configuration
server.port=${PORT:8080}

# MySQL Database Configuration
# Defaults to local MySQL instance, but supports environment variables for production deployment
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/clothing_inventory?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:MySQL@123}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Spring Data JPA / Hibernate Configuration
# update mode ensures table schemas are validated/updated without dropping existing tables or data
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# Logging Configuration
logging.level.org.springframework.web=INFO
logging.level.com.pradeesha.clothing_inventory=INFO